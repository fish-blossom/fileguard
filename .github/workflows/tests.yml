# Regression tests (static only; nothing here executes a sample). Runs on pushes/PRs that touch
# the engine or the tests. tests/ is never part of the release tarball (build_release.sh packs
# only backend/).
name: tests

on:
  push:
    branches: [main]
    paths: ["backend/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["backend/**", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmagic1 >/dev/null
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r backend/requirements.txt
      - name: Run regression tests
        run: /tmp/venv/bin/python -W error::ResourceWarning -m unittest discover -s tests/regression -v
      - name: Release tarball excludes tests
        run: |
          bash backend/scripts/build_release.sh /tmp/dist >/dev/null
          ! tar -tzf /tmp/dist/fileguard.tar.gz | grep -E '^fileguard/(tests|samples)/'
          tar -tzf /tmp/dist/fileguard.tar.gz | grep -q '^fileguard/examples/invoice_431.pdf$'
