name: Release

# Build, sign, attest, and publish a FileGuard GitHub Release.
# Default path: bump backend/VERSION, commit, tag vX.Y.Z, push the tag.
# Do not also create the Release from a developer machine; this workflow is the only publisher.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.5.2). For retries of a failed run."
        required: true
        type: string

# One release job per tag; do not cancel an in-flight publish.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, sign, attest, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      FILEGUARD_REPO: fish-blossom/fileguard
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Check tag matches backend/VERSION
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER="$(tr -d ' \t\r' < backend/VERSION)"
          if [ "$TAG" != "v$VER" ]; then
            echo "tag $TAG does not match backend/VERSION ($VER)" >&2
            exit 1
          fi
          echo "building FileGuard $VER from $(git rev-parse HEAD)"

      - name: Import release signing key
        env:
          # Secret contents are the ed25519 private key. Never echo or log this value.
          SIGNING_KEY: ${{ secrets.FILEGUARD_SIGNING_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "FILEGUARD_SIGNING_KEY secret is not set; refusing to publish an unsigned release" >&2
            exit 1
          fi
          umask 077
          KEY_PATH="${RUNNER_TEMP}/fileguard-release-ed25519"
          export KEY_PATH
          python3 -c "import os; p=os.environ['KEY_PATH']; v=os.environ['SIGNING_KEY']; v=v if v.endswith(chr(10)) else v+chr(10); fh=open(p,'w'); fh.write(v); fh.close(); os.chmod(p, 0o600)"
          ssh-keygen -y -f "$KEY_PATH" > "${KEY_PATH}.pub"
          chmod 600 "${KEY_PATH}.pub"
          printf 'FILEGUARD_SIGNING_KEY=%s\nKEY_PATH=%s\n' "$KEY_PATH" "$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and sign the release
        run: bash backend/scripts/build_release.sh "${{ github.workspace }}/dist"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/dist/fileguard.tar.gz
            ${{ github.workspace }}/dist/manifest.json

      - name: Collect attestation bundle
        if: steps.attest.outputs.bundle-path != ''
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" "${{ github.workspace }}/dist/fileguard.tar.gz.intoto.jsonl"
          ls -l dist

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          VER="$(tr -d ' \t\r' < backend/VERSION)"
          NOTES="${RUNNER_TEMP}/release-notes.md"
          ATTEST_LINE=""
          if [ -n "${ATTESTATION_URL:-}" ]; then
            ATTEST_LINE="Provenance attestation: ${ATTESTATION_URL}"
          fi
          cat > "$NOTES" << EOF
          FileGuard ${VER} - signed release with GitHub Actions build provenance.

          **Verify / 校验**
          \`\`\`bash
          ssh-keygen -Y verify -f backend/release-signers -I fileguard-release@fish-blossom -n fileguard-release -s manifest.json.sig < manifest.json
          sha256sum -c fileguard.tar.gz.sha256
          # Optional, when GitHub CLI is installed:
          gh attestation verify fileguard.tar.gz --repo fish-blossom/fileguard
          # Offline (bundle shipped with this release):
          gh attestation verify fileguard.tar.gz --repo fish-blossom/fileguard --bundle fileguard.tar.gz.intoto.jsonl
          \`\`\`
          Release key: \`SHA256:DlEdYt0Qop4w3SOxZftlpWCjDu9/EunWjVX+8olt6fs\` (ED25519)

          This build was produced by the \`release.yml\` workflow on the \`v${VER}\` tag. A SLSA build-provenance attestation is published with the release.
          ${ATTEST_LINE}
          EOF
          # The heredoc body above is indented by the workflow file; strip the common indent.
          python3 -c "import pathlib; p=pathlib.Path('$NOTES'); t=p.read_text(); lines=t.splitlines(); ind=min((len(l)-len(l.lstrip(' ')) for l in lines if l.strip()), default=0); p.write_text('\n'.join(l[ind:] if len(l)>=ind else l for l in lines)+('\n' if t.endswith('\n') else ''))"
          ASSETS=(
            dist/fileguard.tar.gz
            dist/fileguard.tar.gz.sha256
            dist/manifest.json
            dist/manifest.json.sig
          )
          if [ -f dist/fileguard.tar.gz.intoto.jsonl ]; then
            ASSETS+=(dist/fileguard.tar.gz.intoto.jsonl)
          fi
          if gh release view "$TAG" --repo "$FILEGUARD_REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading assets"
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$FILEGUARD_REPO" --clobber
            gh release edit "$TAG" --repo "$FILEGUARD_REPO" --title "FileGuard ${VER}" --notes-file "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$FILEGUARD_REPO" \
              --title "FileGuard ${VER}" \
              --notes-file "$NOTES"
          fi

      - name: Wipe signing key
        if: always()
        run: |
          set +x
          KEY="${KEY_PATH:-}"
          case "$KEY" in
            "${RUNNER_TEMP}"/*)
              if [ -f "$KEY" ]; then
                shred -u "$KEY" "${KEY}.pub" 2>/dev/null || rm -f "$KEY" "${KEY}.pub"
              fi
              ;;
          esac
